<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тесты по Базам данных</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #f2f5f9;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
            min-height: 100vh;
        }

        .quiz-container {
            max-width: 720px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.25);
            padding: 2rem 2rem 2.2rem;
            position: relative;
            overflow: hidden;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1.6rem;
            flex-wrap: wrap;
        }

        .btn-home, .btn-tests {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.92rem;
            padding: 0.55rem 1.1rem;
            border-radius: 40px;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            white-space: nowrap;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        .btn-home {
            background: #1e6f9f;
            color: #ffffff;
            box-shadow: 0 4px 10px -4px rgba(30, 111, 159, 0.5);
        }

        .btn-home:hover {
            background: #155a82;
            box-shadow: 0 6px 14px -4px rgba(30, 111, 159, 0.6);
        }

        .btn-tests {
            background: #eef4f9;
            color: #1e6f9f;
            border: 1.5px solid #cddbe8;
        }

        .btn-tests:hover {
            background: #e0ebf5;
            border-color: #a6c2db;
        }

        .btn-home:active, .btn-tests:active { transform: scale(0.96); }

        .menu-screen { text-align: center; animation: fadeSlide 0.4s ease; }

        .menu-emoji { font-size: 3.5rem; line-height: 1; margin-bottom: 0.6rem; }

        .menu-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0b2b4a;
            margin-bottom: 0.4rem;
        }

        .menu-sub { color: #4b6379; font-size: 1rem; margin-bottom: 2rem; }

        .menu-cards { display: flex; flex-direction: column; gap: 1rem; }

        .menu-card {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            padding: 1.3rem 1.5rem;
            background: #f9fcff;
            border: 1.5px solid #dfe9f2;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
            text-align: left;
            color: #1f3b57;
        }

        .menu-card:hover {
            background: #edf4fc;
            border-color: #a6c2db;
            transform: translateY(-2px);
        }

        .menu-card:active { transform: scale(0.99); }

        .menu-card-icon {
            font-size: 2rem;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e5f0fb;
            border-radius: 16px;
            flex-shrink: 0;
        }

        .menu-card-body { flex: 1; }

        .menu-card-title {
            font-weight: 700;
            font-size: 1.15rem;
            color: #0c2d4b;
            margin-bottom: 0.25rem;
        }

        .menu-card-desc { color: #566f85; font-size: 0.9rem; }

        .menu-card-arrow { font-size: 1.4rem; color: #1e6f9f; }

        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.8rem;
        }

        .progress-track {
            flex: 1;
            height: 10px;
            background: #e2ebf4;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1e6f9f, #3ea0d6);
            border-radius: 20px;
            transition: width 0.35s ease;
            width: 0%;
        }

        .progress-text {
            font-size: 0.9rem;
            font-weight: 600;
            color: #4b6379;
            white-space: nowrap;
        }

        .card { animation: fadeSlide 0.35s ease; }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateX(20px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .quiz-label {
            display: inline-block;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #1e6f9f;
            background: #e5f0fb;
            padding: 0.25rem 0.7rem;
            border-radius: 30px;
            margin-bottom: 1rem;
        }

        .question-header {
            display: flex;
            align-items: baseline;
            gap: 1rem;
            margin-bottom: 1.3rem;
        }

        .question-number {
            background: #1e6f9f;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            flex-shrink: 0;
        }

        .question-text {
            font-weight: 600;
            font-size: 1.2rem;
            color: #0c2d4b;
            line-height: 1.4;
        }

        .options { display: flex; flex-direction: column; gap: 0.7rem; margin-top: 1rem; }

        .option {
            display: flex;
            align-items: flex-start;
            gap: 0.85rem;
            padding: 0.9rem 1rem;
            background: #f9fcff;
            border-radius: 14px;
            border: 1.5px solid #dfe9f2;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
            font-size: 1rem;
            color: #1f3b57;
        }

        .option:hover { background: #edf4fc; border-color: #a6c2db; }
        .option:active { transform: scale(0.99); }

        .option.selected {
            background: #e5f0fb;
            border-color: #1e6f9f;
            box-shadow: 0 0 0 1px #1e6f9f inset;
        }

        .option.locked { cursor: default; }
        .option.locked:hover { background: #f9fcff; border-color: #dfe9f2; }

        .option.option-correct {
            background: #d7f0e4 !important;
            border-color: #2b8c5e !important;
            color: #145a38;
            font-weight: 500;
            cursor: default;
        }
        .option.option-correct:hover {
            background: #d7f0e4 !important;
            border-color: #2b8c5e !important;
        }

        .option.option-wrong {
            background: #ffe1e1 !important;
            border-color: #c73e3e !important;
            color: #8b2c2c;
            cursor: default;
        }
        .option.option-wrong:hover {
            background: #ffe1e1 !important;
            border-color: #c73e3e !important;
        }

        .option .mark {
            font-weight: 700;
            font-size: 1.05rem;
            width: 18px;
            text-align: center;
            flex-shrink: 0;
            display: none;
        }

        .option.option-correct .mark,
        .option.option-wrong .mark { display: inline-block; }

        .option.option-correct .mark { color: #1e6e48; }
        .option.option-wrong .mark { color: #a63a3a; }

        .option input[type="radio"],
        .option input[type="checkbox"] {
            margin-top: 3px;
            width: 18px;
            height: 18px;
            accent-color: #1e6f9f;
            flex-shrink: 0;
            cursor: pointer;
        }

        .option.locked input { cursor: default; }

        .option label { cursor: pointer; flex: 1; line-height: 1.45; }
        .option.locked label { cursor: default; }

        .multi-hint {
            font-size: 0.85rem;
            color: #859eb3;
            margin-top: 0.6rem;
            font-style: italic;
        }

        .feedback {
            margin-top: 1.2rem;
            padding: 0.85rem 1.1rem;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.98rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            animation: fadeSlide 0.3s ease;
        }

        .feedback.ok {
            background: #d7f0e4;
            color: #145a38;
            border: 1px solid #a8ddc3;
        }

        .feedback.no {
            background: #ffe1e1;
            color: #8b2c2c;
            border: 1px solid #f2baba;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-top: 1.8rem;
        }

        .btn {
            border: none;
            font-weight: 600;
            font-size: 1rem;
            padding: 0.85rem 1.8rem;
            border-radius: 60px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, opacity 0.2s;
            background: white;
            color: #1e6f9f;
            border: 1.5px solid #1e6f9f;
            white-space: nowrap;
        }

        .btn-primary {
            background: #1e6f9f;
            color: white;
            border: 1.5px solid #1e6f9f;
        }

        .btn-primary:hover:not(:disabled) {
            background: #155a82;
            border-color: #155a82;
        }

        .btn-secondary:hover:not(:disabled) { background: #e6f0f9; }
        .btn:active:not(:disabled) { transform: scale(0.97); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-ghost {
            background: transparent;
            border: 1.5px solid #cddbe8;
            color: #4b6379;
        }

        .btn-ghost:hover:not(:disabled) {
            background: #eef4f9;
            border-color: #a6c2db;
        }

        .result-screen { text-align: center; animation: fadeSlide 0.4s ease; }

        .result-emoji { font-size: 4rem; line-height: 1; margin-bottom: 0.5rem; }

        .result-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0b2b4a;
            margin-bottom: 0.5rem;
        }

        .result-score {
            font-size: 1.1rem;
            color: #4b6379;
            margin-bottom: 1.8rem;
            line-height: 1.6;
        }

        .result-score strong { color: #1e6f9f; font-size: 1.3rem; }

        .result-actions {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .review-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1.8rem;
            text-align: left;
            max-height: 55vh;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .review-list::-webkit-scrollbar { width: 8px; }
        .review-list::-webkit-scrollbar-thumb {
            background: #cddbe8;
            border-radius: 10px;
        }

        .review-item {
            background: #f9fcff;
            border-radius: 14px;
            padding: 0.9rem 1rem;
            border: 1px solid #dbe6f0;
            border-left: 5px solid #cddbe8;
            font-size: 0.95rem;
        }

        .review-item.correct { border-left-color: #2b8c5e; }
        .review-item.wrong { border-left-color: #c73e3e; }

        .review-q {
            font-weight: 600;
            color: #0c2d4b;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .review-ans { font-size: 0.9rem; color: #566f85; line-height: 1.5; }
        .review-ans .ok-label { color: #1e6e48; font-weight: 600; }
        .review-ans .no-label { color: #a63a3a; font-weight: 600; }

        .hidden { display: none !important; }

        @media (max-width: 550px) {
            .quiz-container { padding: 1.4rem 1rem 1.6rem; }
            .question-text { font-size: 1.05rem; }
            .btn { padding: 0.75rem 1.2rem; font-size: 0.92rem; }
            .nav-bar { gap: 0.5rem; }
            .result-title { font-size: 1.3rem; }
            .menu-title { font-size: 1.4rem; }
            .menu-card { padding: 1rem 1.1rem; }
            .menu-card-icon { width: 46px; height: 46px; font-size: 1.6rem; }
            .top-bar { justify-content: center; }
        }
    </style>
</head>

        function arraysEqualAsSets(a, b) {
            if (!a || !b) return false;
            if (a.length !== b.length) return false;
            const sa = [...a].sort((x, y) => x - y);
            const sb = [...b].sort((x, y) => x - y);
            for (let i = 0; i < sa.length; i++) {
                if (sa[i] !== sb[i]) return false;
            }
            return true;
        }

        function isAnswerCorrect(qIdx, ans) {
            const q = state.test.questions[qIdx];
            const correctShuffled = state.shuffledCorrect[qIdx];
            if (q.type === 'multiple') {
                return arraysEqualAsSets(ans || [], correctShuffled);
            }
            return ans === correctShuffled[0];
        }

        function isAnswerEmpty(q, ans) {
            if (q.type === 'multiple') {
                return !ans || ans.length === 0;
            }
            return ans === null || ans === undefined;
        }

        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function prepareShuffled(test) {
            const shuffledOptions = [];
            const shuffledCorrect = [];

            test.questions.forEach(q => {
                const indices = q.options.map((_, i) => i);
                const shuffled = shuffleArray(indices);
                shuffledOptions.push(shuffled);

                if (q.type === 'multiple') {
                    const newCorrect = [];
                    shuffled.forEach((origIdx, displayIdx) => {
                        if (q.correctIndexes.includes(origIdx)) {
                            newCorrect.push(displayIdx);
                        }
                    });
                    shuffledCorrect.push(newCorrect);
                } else {
                    const newCorrectIdx = shuffled.indexOf(q.correctIndex);
                    shuffledCorrect.push([newCorrectIdx]);
                }
            });

            return { shuffledOptions, shuffledCorrect };
        }

        function startTest(key) {
            const test = TESTS[key];
            state.test = test;
            state.currentIndex = 0;
            state.answered = new Array(test.questions.length).fill(false);
            state.userAnswers = test.questions.map(q =>
                q.type === 'multiple' ? [] : null

            state.shuffledOptions = prepared.shuffledOptions;
            state.shuffledCorrect = prepared.shuffledCorrect;

            state.screen = 'quiz';
            renderQuestion();

        function updateProgress() {
            const fill = document.getElementById('progressFill');
            const text = document.getElementById('progressText');
            if (!fill || !text) return;

            if (state.screen === 'result') {
                fill.style.width = '100%';
                text.textContent = 'Завершено';
                return;
            }
            const total = state.test.questions.length;
            const current = state.currentIndex + 1;
            const percent = (state.currentIndex / total) * 100;
            fill.style.width = percent + '%';
            text.textContent = `${current} / ${total}`;
        }

        function renderQuestion() {
            state.screen = 'quiz';
            const test = state.test;
            const qIdx = state.currentIndex;
            const q = test.questions[qIdx];
            const isAnswered = state.answered[qIdx];
            const isLast = qIdx === test.questions.length - 1;
            const qType = q.type || 'single';
            const userAns = state.userAnswers[qIdx];

            const order = state.shuffledOptions[qIdx];
            const correctDisplayed = state.shuffledCorrect[qIdx];

            let optionsHtml = '';
            order.forEach((origIdx, displayIdx) => {
                const opt = q.options[origIdx];

                let isSelected = false;
                if (qType === 'multiple') {
                    isSelected = Array.isArray(userAns) && userAns.includes(displayIdx);
                } else {
                    isSelected = (userAns === displayIdx);
                }

                const isCorrectOpt = correctDisplayed.includes(displayIdx);

                let cls = 'option';
                let mark = '';

                if (isAnswered) {
                    cls += ' locked';
                    if (isCorrectOpt) {
                        cls += ' option-correct';
                        mark = '✓';
                    } else if (isSelected && !isCorrectOpt) {
                        cls += ' option-wrong';
                        mark = '✗';
                    }
                } else if (isSelected) {
                    cls += ' selected';
                }

                const inputType = qType === 'multiple' ? 'checkbox' : 'radio';

                optionsHtml += `
                    <div class="${cls}" data-oidx="${displayIdx}">
                        <span class="mark">${mark}</span>
                        <input type="${inputType}" name="q" value="${displayIdx}"
                            ${isSelected ? 'checked' : ''}
                            ${isAnswered ? 'disabled' : ''}
                            id="opt_${displayIdx}">
                        <label for="opt_${displayIdx}">${opt}</label>
                    </div>
                `;

            let feedbackHtml = '';

                const isCorrect = isAnswerCorrect(qIdx, userAns);

                            optionDiv.classList.add('selected');
                            const radio = optionDiv.querySelector('input[type="radio"]');

                            state.userAnswers[qIdx] = oIdx;

                        radio.addEventListener('change', () => {
                            const oIdx = parseInt(radio.value);
                            document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
                            const parent = radio.closest('.option');
                            if (parent) parent.classList.add('selected');
                            state.userAnswers[qIdx] = oIdx;
                        });
                    });
                } else {
                    document.querySelectorAll('.option').forEach(optionDiv => {
                        optionDiv.addEventListener('click', () => {
                            setTimeout(() => {
                                const oIdx = parseInt(optionDiv.dataset.oidx);
                                const checkbox = optionDiv.querySelector('input[type="checkbox"]');
                                if (!checkbox) return;
                                const isChecked = checkbox.checked;
                                let current = state.userAnswers[qIdx] || [];
                                current = current.filter(x => x !== oIdx);
                                if (isChecked) current.push(oIdx);
                                current.sort((a, b) => a - b);
                                state.userAnswers[qIdx] = current;
                                if (isChecked) optionDiv.classList.add('selected');
                                else optionDiv.classList.remove('selected');
                            }, 0);
                        });
                    });

                    document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                        cb.addEventListener('change', () => {
                            const oIdx = parseInt(cb.value);
                            const parent = cb.closest('.option');
                            let current = state.userAnswers[qIdx] || [];
                            current = current.filter(x => x !== oIdx);
                            if (cb.checked) {
                                current.push(oIdx);
                                if (parent) parent.classList.add('selected');
                            } else {
                                if (parent) parent.classList.remove('selected');
                            }
                            current.sort((a, b) => a - b);
                            state.userAnswers[qIdx] = current;
                        });
                    });
                }
            }

            document.getElementById('backBtn').addEventListener('click', () => {
                if (qIdx > 0) {

            document.getElementById('nextBtn').addEventListener('click', () => {

                        return;
                    }
                    state.answered[qIdx] = true;
                    renderQuestion();
                } else {
                    if (isLast) {
                        renderResult();
                    } else {
                        state.currentIndex++;
                        renderQuestion();
                    }
                }
            });
        }

        function renderResult() {

            test.questions.forEach((q, idx) => {

            else if (percent < 100) { emoji = '🌟'; title = 'Почти идеально!'; }

            let reviewHtml = '';
            test.questions.forEach((q, idx) => {
                const ans = state.userAnswers[idx];
                const isCorrect = isAnswerCorrect(idx, ans);
                const qType = q.type || 'single';

                const order = state.shuffledOptions[idx];
                const correctDisplayed = state.shuffledCorrect[idx];

                let yourAnswerText = '—';
                let correctAnswerText = '';

                if (qType === 'multiple') {
                    yourAnswerText = (ans && ans.length)
                        ? ans.map(i => q.options[order[i]]).join('; ')
                        : '—';
                    correctAnswerText = correctDisplayed.map(i => q.options[order[i]]).join('; ');
                } else {
                    yourAnswerText = (ans !== null && ans !== undefined)
                        ? q.options[order[ans]]
                        : '—';
                    correctAnswerText = q.options[order[correctDisplayed[0]]];
                }

                reviewHtml += `
                    <div class="review-item ${isCorrect ? 'correct' : 'wrong'}">
                        <div class="review-q">${idx + 1}. ${q.text}</div>
                        <div class="review-ans">
                            Ваш ответ: <b>${yourAnswerText}</b>
                            ${isCorrect
                                ? '<span class="ok-label"> ✓</span>'
                                : `<span class="no-label"> ✗</span><br>Правильный: <b>${correctAnswerText}</b>`
                            }
                        </div>
                    </div>
                `;
            });

            app.innerHTML = `
                ${topBarHTML()}
                <div class="progress-wrap">
                    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
                    <div class="progress-text" id="progressText"></div>
                </div>
                <div class="result-screen">
                    <div class="result-emoji">${emoji}</div>
                    <div class="result-title">${title}</div>
                    <div class="result-score">
                        ${test.emoji} ${test.title}<br>
                        Правильных ответов: <strong>${correctCount} из ${total}</strong> (${percent}%)
                    </div>
                    <div class="result-actions">
                        <button class="btn btn-primary" id="restartBtn">⟲ Пройти заново</button>
                        <button class="btn btn-secondary" id="menuBtn">🏠 К выбору теста</button>
                    </div>
                    <div style="text-align:left; margin-top: 1.8rem;">
                        <div style="font-weight:600; color:#0b2b4a; margin-bottom:0.4rem; font-size:1.05rem;">📋 Разбор ответов</div>
                        <div class="review-list">
                            ${reviewHtml}
                        </div>
                    </div>
                </div>
            `;

            updateProgress();
            attachTopBarHandlers();

            document.getElementById('restartBtn').addEventListener('click', () => startTest(test.id));
            document.getElementById('menuBtn').addEventListener('click', renderMenu);
        }

        renderMenu();
    </script>
</body>
</html>
